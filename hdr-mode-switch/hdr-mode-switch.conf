# Modes where HDR really works, one "Display name:WxH@R" per line.
# Display name = "Display Make" + " " + "Display Model" from gamescopectl.
# When HDR goes on in another mode, the best mode from this list with resolution and refresh at or below the current ones is set.
#
# LG G3 through the Ugreen CM800 dock, checked on the TV 2026-11-13:
# 4K60 HDR works; 4K100 and 4K120 HDR are washed out (DSC 10 bpp, ODM 2:1).
# 1440p120 HDR works (user-checked 2026-11-13).
LG Electronics LG TV SSCR2:3840x2160@60
LG Electronics LG TV SSCR2:2560x1440@120
LG Electronics LG TV SSCR2:1920x1080@120  # added untested 2026-11-13, user to verify on TV (VRR on 1080p120 gave no signal earlier)
